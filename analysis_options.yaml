include: package:lints/recommended.yaml
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    implementation_imports: error
    depend_on_referenced_packages: error
  exclude:
    - "**/no_compile/**"
    - "**/.dart_tool/**"
linter:
  rules:
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
formatter:
  page_width: 120
